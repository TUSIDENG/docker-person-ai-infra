version: '3.8'

services:
  # n8n 工作流引擎
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    env_file:
      - ../.env
    container_name: runtime-n8n
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=${N8N_DB_HOST:-db-postgres}
      - DB_POSTGRESDB_PORT=${N8N_DB_PORT:-5432}
      - DB_POSTGRESDB_DATABASE=${N8N_DB_NAME:-n8n}
      - DB_POSTGRESDB_USER=${N8N_DB_USER:-postgres}
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD:-your_secure_db_password}
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=${N8N_EXECUTIONS_MAX_AGE:-72}
    volumes:
      - ./data/n8n:/home/node/.n8n
    networks:
      - ai-infra-network
    restart: always

  # OpenClaw 智能体运行时
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    env_file:
      - ../.env
    container_name: runtime-openclaw
    ports:
      - "${OPENCLAW_PORT:-8000}:8000"
      - "${OPENCLAW_GATEWAY_PORT:-18799}:18799"
    environment:
      - OPENCLAW_ENV=production
      - OPENCLAW_GATEWAY_PORT=${OPENCLAW_GATEWAY_PORT:-18799}
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-}
      - gateway.mode=local
      - VECTOR_STORE_URL=${OPENCLAW_VECTOR_STORE_URL:-http://db-qdrant:6333}
      - VECTOR_STORE_API_KEY=${OPENCLAW_VECTOR_STORE_API_KEY:-your_secure_qdrant_key}
      - OPENAI_API_BASE=${OPENCLAW_OPENAI_API_BASE:-http://model-ollama:11434/v1}
      - EMBEDDING_API_BASE=http://model-ollama:11434/v1
    volumes:
      - ./data/openclaw:/home/node/.openclaw
      - ${DOCKER_SOCKET_HOST}:/var/run/docker.sock
    networks:
      - ai-infra-network
    restart: always
    command: ["node", "openclaw.mjs", "gateway", "--allow-unconfigured"]

networks:
  ai-infra-network:
    external: true