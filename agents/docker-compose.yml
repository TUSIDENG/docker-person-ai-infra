version: '3.8'

services:
  # n8n 工作流引擎
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    env_file:
      - ../.env
    container_name: runtime-n8n
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=${N8N_DB_HOST:-db-postgres}
      - DB_POSTGRESDB_PORT=${N8N_DB_PORT:-5432}
      - DB_POSTGRESDB_DATABASE=${N8N_DB_NAME:-n8n}
      - DB_POSTGRESDB_USER=${N8N_DB_USER:-postgres}
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD:-your_secure_db_password}
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=${N8N_EXECUTIONS_MAX_AGE:-72}
    volumes:
      - ./data/n8n:/home/node/.n8n
    networks:
      - ai-infra-network
    restart: always

  # OpenClaw 智能体运行时（自定义构建）
  openclaw:
    build:
      context: ./openclaw
      dockerfile: Dockerfile
    image: openclaw/runtime:custom  # 自定义镜像标签
    env_file:
      - ../.env
    container_name: runtime-openclaw
    ports:
      - "${OPENCLAW_PORT:-8000}:8000"
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"  # 健康检查端口
    environment:
      - OPENCLAW_ENV=production
      - VECTOR_STORE_URL=${OPENCLAW_VECTOR_STORE_URL:-http://db-qdrant:6333}
      - VECTOR_STORE_API_KEY=${OPENCLAW_VECTOR_STORE_API_KEY:-your_secure_qdrant_key}
      - OPENAI_API_BASE=${OPENCLAW_OPENAI_API_BASE:-http://model-ollama:11434/v1}
      # OPENAI_API_KEY=  # 自建 Ollama 服务不需要 API Key，留空
      - EMBEDDING_API_BASE=http://model-ollama:11434/v1  # 向量模型 API
    volumes:
      - ./data/openclaw:/app/workspaces        # 工作目录
      - ./data/openclaw/config:/app/config     # 配置目录
      - ${DOCKER_SOCKET_HOST}:/var/run/docker.sock  # 允许 OpenClaw 动态拉起独立隔离的安全执行微沙箱
    networks:
      - ai-infra-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  ai-infra-network:
    external: true