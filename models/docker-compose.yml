version: '3.8'

services:
  # 大模型运行时（通过 Ollama 统一管理 7B Gemma 与 Embedding 模型）
  ollama:
    image: ollama/ollama:latest
    container_name: model-ollama
    volumes:
      - ./data/ollama:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - ai-infra-network
    restart: always
    # 如果宿主机有英伟达显卡，请取消下方 deploy 的注释以开启 GPU 加速
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

networks:
  ai-infra-network:
    external: true