services:
  # 大模型运行时（通过 Ollama 统一管理模型）
  ollama:
    image: ollama/ollama:latest
    container_name: ${OLLAMA_CONTAINER_NAME:-model-ollama}
    volumes:
      - ./data/ollama:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    networks:
      - ai-infra-network
    restart: always
    environment:
      # Ollama 服务配置（让服务监听所有接口，CLI 通过 localhost 连接）
      # - OLLAMA_HOST=127.0.0.1 # cli 可以成功调用
      - OLLAMA_HOST=0.0.0.0 # 服务监听所有接口，其他容器可以访问
      - OLLAMA_MODELS=/root/.ollama/models
      # 代理配置（默认为空，防止拉取识别）
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - http_proxy=${HTTP_PROXY:-}
      - https_proxy=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1}
      - no_proxy=${NO_PROXY:-localhost,127.0.0.1}
    # 如果宿主机有英伟达显卡，请取消下方 deploy 的注释以开启 GPU 加速
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # 模型初始化服务（启动时自动拉取配置的模型）
  ollama-pull:
    image: ollama/ollama:latest
    container_name: ${OLLAMA_PULL_CONTAINER_NAME:-model-ollama-pull}
    depends_on:
      ollama:
        condition: service_started
    volumes:
      - ./data/ollama:/root/.ollama
    networks:
      - ai-infra-network
    restart: on-failure:3
    environment:
      - OLLAMA_HOST=http://ollama:11434
      # 代理配置
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - http_proxy=${HTTP_PROXY:-}
      - https_proxy=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,ollama}
      - no_proxy=${NO_PROXY:-localhost,127.0.0.1,ollama}
    # 覆盖默认 entrypoint，使用 bash 执行命令
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "
        echo '等待 Ollama 服务启动...';
        sleep 10;
        echo '开始拉取模型...';
        
        # 拉取大模型
        if [ -n '${LLM_MODEL:-gemma2:9b}' ]; then
          echo '拉取大模型: ${LLM_MODEL:-gemma2:9b}';
          ollama pull ${LLM_MODEL:-gemma2:9b} || true;
        fi
        
        # 拉取向量模型
        if [ -n '${EMBEDDING_MODEL:-nomic-embed-text}' ]; then
          echo '拉取向量模型: ${EMBEDDING_MODEL:-nomic-embed-text}';
          ollama pull ${EMBEDDING_MODEL:-nomic-embed-text} || true;
        fi
        
        # 拉取额外模型（可选）
        if [ -n '${EXTRA_MODELS:-}' ]; then
          for model in $(echo '${EXTRA_MODELS:-}' | tr ',' ' '); do
            if [ -n '$$model' ]; then
              echo '拉取额外模型: '$$model'';
              ollama pull $$model || true;
            fi
          done
        fi
        
        echo '模型拉取完成！';
        ollama list;
      "

  # Ollama CLI 服务（专门用于执行 ollama 命令）
  ollama-cli:
    image: ollama/ollama:latest
    container_name: ${OLLAMA_CLI_CONTAINER_NAME:-model-ollama-cli}
    depends_on:
      ollama:
        condition: service_started
    volumes:
      - ./data/ollama:/root/.ollama
    networks:
      - ai-infra-network
    restart: no
    environment:
      - OLLAMA_HOST=http://ollama:11434
      # 代理配置
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - http_proxy=${HTTP_PROXY:-}
      - https_proxy=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,ollama}
      - no_proxy=${NO_PROXY:-localhost,127.0.0.1,ollama}
    # 保持容器运行，等待命令执行
    entrypoint: ["/bin/sh", "-c"]
    command: "tail -f /dev/null"

networks:
  ai-infra-network:
    external: true