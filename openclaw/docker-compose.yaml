version: '3.8'

services:
  # OpenClaw 智能体运行时
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    env_file:
      - ../.env
    container_name: runtime-openclaw
    ports:
      - "${OPENCLAW_PORT:-8000}:8000"
      - "${OPENCLAW_GATEWAY_PORT:-18799}:18799"
    environment:
      - OPENCLAW_ENV=production
      - OPENCLAW_GATEWAY_PORT=${OPENCLAW_GATEWAY_PORT:-18799}
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-}
      - gateway.mode=local
      - VECTOR_STORE_URL=${OPENCLAW_VECTOR_STORE_URL:-http://db-qdrant:6333}
      - VECTOR_STORE_API_KEY=${OPENCLAW_VECTOR_STORE_API_KEY:-your_secure_qdrant_key}
      - OPENAI_API_BASE=${OPENCLAW_OPENAI_API_BASE:-http://model-ollama:11434/v1}
      - EMBEDDING_API_BASE=http://model-ollama:11434/v1
    volumes:
      - ./data/openclaw:/home/node/.openclaw
      - ${DOCKER_SOCKET_HOST}:/var/run/docker.sock
    networks:
      - ai-infra-network
    restart: always
    command: ["node", "openclaw.mjs", "gateway", "--allow-unconfigured"]

networks:
  ai-infra-network:
    external: true