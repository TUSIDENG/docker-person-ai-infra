version: '3.8'

services:
  # 统一的 PostgreSQL 关系库（供 Dify 和 n8n 共享）
  postgres:
    image: postgres:15-alpine
    container_name: db-postgres
    env_file:
      - ../.env
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-123456}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - ai-infra-network
    restart: always
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  # 统一的 Redis 缓存与消息队列
  redis:
    image: redis:7.0-alpine
    container_name: db-redis
    env_file:
      - ../.env
    command: redis-server --requirepass ${REDIS_PASSWORD:-123456}
    volumes:
      - ./data/redis:/data
    networks:
      - ai-infra-network
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"

  # Qdrant 向量数据库
  qdrant:
    image: qdrant/qdrant:latest
    container_name: db-qdrant
    env_file:
      - ../.env
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-your_secure_qdrant_key}
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - ai-infra-network
    restart: always
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"

networks:
  ai-infra-network:
    external: true